services:
  # ---------------------------------------------------------
  # 1. Managed PostgreSQL (Free Tier)
  # ---------------------------------------------------------
  - type: pgo
    name: ulpin3d-db
    plan: free
    postgresMajorVersion: 16

  # ---------------------------------------------------------
  # 2. FastAPI Backend (Free Tier)
  # ---------------------------------------------------------
  - type: web
    name: ulpin3d-api
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    # Render will run this command before starting the server 
    # to ensure the database schema and extensions are created.
    preDeployCommand: "psql $DATABASE_URL -f backend/sql/init.sql"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ulpin3d-db
          property: connectionString
      - key: DEMO_DIR
        value: /code/data/demo

  # ---------------------------------------------------------
  # 3. React Frontend (Static Site - Always Free)
  # ---------------------------------------------------------
  - type: web
    name: ulpin3d-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: ulpin3d-api
          property: host
    routes:
      # Redirect all 404s to index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
