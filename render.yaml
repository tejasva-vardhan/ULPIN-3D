services:
  # ---------------------------------------------------------
  # 1. PostGIS Database (Private Service)
  # We deploy this as a custom Docker container instead of a 
  # Managed PostgreSQL database because ULPIN-3D requires the
  # 'postgis_sfcgal' 3D extension, which managed PaaS providers
  # often do not support.
  # ---------------------------------------------------------
  - type: pserv
    name: ulpin3d-db
    env: docker
    dockerfilePath: ./backend/Dockerfile.db
    envVars:
      - key: POSTGRES_USER
        value: ulpin
      - key: POSTGRES_PASSWORD
        value: ulpin3d_secret
      - key: POSTGRES_DB
        value: ulpin3d
    disk:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  # ---------------------------------------------------------
  # 2. FastAPI Backend
  # ---------------------------------------------------------
  - type: web
    name: ulpin3d-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        # This connects internally to the Private Service above
        value: postgresql+psycopg://ulpin:ulpin3d_secret@ulpin3d-db:5432/ulpin3d
      - key: DEMO_DIR
        value: /code/data/demo

  # ---------------------------------------------------------
  # 3. React Frontend (Static Site)
  # ---------------------------------------------------------
  - type: web
    name: ulpin3d-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE
        # This automatically points to the FastAPI service URL
        fromService:
          type: web
          name: ulpin3d-api
          property: host
    routes:
      # Redirect all 404s to index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
